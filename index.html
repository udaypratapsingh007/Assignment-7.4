<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <meta name="description" content="A modern landing page with a header and a hero section built with HTML and CSS.">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Sticky header -->
    <header class="site-header">
      <a href="#" class="logo">CodeLearn</a>

      <nav class="main-nav">
        <a href="#home">Home</a>
        <a href="#courses">Courses</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>

      <a href="#signup" class="cta-button">Get Started</a>
    </header>

    <!-- Hero section -->
    <main>
      <section class="hero" id="home">
        <div class="hero-text">
          <h1>Learn Web Development Step by Step</h1>
          <p>
            Start from the basics of HTML and CSS and build real websites with
            simple lessons and practice projects.
          </p>
          <a href="#signup" class="hero-button">Start Learning</a>
        </div>

        <div class="hero-image">
          <img src="hero.jpg" alt="Student learning web development on a laptop">
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>Copyright 2026 CodeLearn</p>
    </footer>
  </body>
</html>
